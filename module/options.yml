options:
- display: GroupBox
  category:
  - '{{qol}}'
  - '{{cat_display_camera}}'
  header: '{{churches_group}}'
  text: '{{churches_group_descr}}'
  hasHeader: true
  children:
  - url: themed-buildings.enabled
    name: themed-buildings-enabled
    text: '{{enabled_tooltip}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{enabled}}'
  - url: themed-buildings.preview
    name: themed-buildings-preview
    text: '{{preview_tooltip}}'
    enabled: themed-buildings.enabled == true
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{preview}}'
